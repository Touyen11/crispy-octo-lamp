<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定義迷因 (Meme) 產生器</title>
    
    <!-- 引入 Google Fonts (這裡選擇適合迷因爆笑感的 Impact / Noto Sans TC 體系) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">

    <!-- 引入 html2canvas CDN (用於將 DOM 區塊轉為圖片下載) -->
    <script <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
        /* === 全局 CSS 樣式與 RWD 響應式佈局 === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 主要容器：電腦版左右分欄，手機版上下分欄 */
        .app-container {
            display: flex;
            flex-direction: row;
            background-color: #2a2a2a;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 1000px;
            width: 100%;
            overflow: hidden;
        }

        /* 控制面板區塊 (左側 / 上方) */
        .controls-panel {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background-color: #222222;
        }

        .controls-panel h1 {
            font-size: 1.8rem;
            color: #00ffcc;
            text-align: center;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.95rem;
            color: #dddddd;
            display: flex;
            justify-content: space-between;
        }

        /* 輸入框與滑桿樣式 */
        input[type="text"], input[type="file"] {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #333;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #00ffcc;
        }

        input[type="range"] {
            accent-color: #00ffcc;
            cursor: pointer;
        }

        /* 超酷下載按鈕 */
        .download-btn {
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00ffcc, #0099ff);
            color: #000;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4);
        }

        /* 迷因即時預覽區 (右側 / 下方) */
        .preview-panel {
            flex: 1;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #181818;
        }

        /* 被 html2canvas 截圖的目標區塊 */
        .meme-box {
            position: relative;
            width: 100%;
            max-width: 450px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .meme-box img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* 迷因文字共通樣式 (加上黑色粗邊框與陰影) */
        .meme-text {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            color: white;
            font-weight: 900;
            word-wrap: break-word;
            line-height: 1.2;
            text-transform: uppercase;
            /* 黑色粗邊框 (利用 text-shadow 模擬) */
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                -3px  0px 0 #000,
                 3px  0px 0 #000,
                 0px -3px 0 #000,
                 0px  3px 0 #000;
            user-select: none;
            pointer-events: none; /* 避免文字擋住鼠標點擊 */
        }

        .top-text {
            top: 20px;
        }

        .bottom-text {
            bottom: 20px;
        }

        /* 手機版 (RWD 斷點設為 768px) */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- 頁面主體結構 -->
    <div class="app-container">
        
        <!-- 左側/上方：控制面板區塊 -->
        <div class="controls-panel">
            <h1>迷因產生器</h1>

            <!-- 圖片上傳 (使用 FileReader 避免 CORS 錯誤) -->
            <div class="form-group">
                <label for="imageUpload">1. 選擇背景圖片</label>
                <input type="file" id="imageUpload" accept="image/*">
            </div>

            <!-- 文字輸入框 -->
            <div class="form-group">
                <label for="topTextInput">2. 上方文字</label>
                <input type="text" id="topTextInput" placeholder="輸入上方文字...">
            </div>

            <div class="form-group">
                <label for="bottomTextInput">3. 下方文字</label>
                <input type="text" id="bottomTextInput" placeholder="輸入下方文字...">
            </div>

            <!-- 參數滑桿控制 (字體大小 & 垂直位置) -->
            <div class="form-group">
                <label>4. 字體大小 <span id="fontSizeVal">32px</span></label>
                <input type="range" id="fontSizeSlider" min="16" max="64" value="32">
            </div>

            <div class="form-group">
                <label>5. 上方文字垂直位置 <span id="topPosVal">20px</span></label>
                <input type="range" id="topPosSlider" min="0" max="150" value="20">
            </div>

            <div class="form-group">
                <label>6. 下方文字垂直位置 <span id="bottomPosVal">20px</span></label>
                <input type="range" id="bottomPosSlider" min="0" max="150" value="20">
            </div>

            <!-- 一鍵下載按鈕 -->
            <button class="download-btn" id="downloadBtn">🚀 一鍵下載迷因 (my-meme.png)</button>
        </div>

        <!-- 右側/下方：迷因即時預覽區 -->
        <div class="preview-panel">
            <div class="meme-box" id="memeContainer">
                <!-- 預設底圖 (預覽用) -->
                <img id="memeImage" src="https://via.placeholder.com/500x500/333333/ffffff?text=Please+Upload+Image" alt="Meme Background">
                <!-- 文字疊加層 -->
                <div class="meme-text top-text" id="topTextDisplay">上方文字預覽</div>
                <div class="meme-text bottom-text" id="bottomTextDisplay">下方文字預覽</div>
            </div>
        </div>

    </div>

    <!-- === JavaScript 邏輯控制 === -->
    <script>
        // 取得所有需要的 HTML 元素 DOM
        const imageUpload = document.getElementById('imageUpload');
        const memeImage = document.getElementById('memeImage');
        
        const topTextInput = document.getElementById('topTextInput');
        const bottomTextInput = document.getElementById('bottomTextInput');
        const topTextDisplay = document.getElementById('topTextDisplay');
        const bottomTextDisplay = document.getElementById('bottomTextDisplay');

        const fontSizeSlider = document.getElementById('fontSizeSlider');
        const topPosSlider = document.getElementById('topPosSlider');
        const bottomPosSlider = document.getElementById('bottomPosSlider');

        const fontSizeVal = document.getElementById('fontSizeVal');
        const topPosVal = document.getElementById('topPosVal');
        const bottomPosVal = document.getElementById('bottomPosVal');

        const downloadBtn = document.getElementById('downloadBtn');
        const memeContainer = document.getElementById('memeContainer');

        /* 1. 本機圖片上傳邏輯 (使用 FileReader 避免跨域 CORS 錯誤) */
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                // 檔案讀取完成後觸發
                reader.onload = function(event) {
                    memeImage.src = event.target.result; // 將 Base64 碼賦予給 img 標籤
                };
                reader.readAsDataURL(file); // 讀取圖片轉為 DataURL (Base64)
            }
        });

        /* 2. 文字即時同步顯示 */
        topTextInput.addEventListener('input', function() {
            topTextDisplay.innerText = this.value || '上方文字預覽';
        });

        bottomTextInput.addEventListener('input', function() {
            bottomTextDisplay.innerText = this.value || '下方文字預覽';
        });

        /* 3. 滑桿動態調整字體大小與垂直位置 */
        // 調整字體大小
        fontSizeSlider.addEventListener('input', function() {
            const size = this.value + 'px';
            topTextDisplay.style.fontSize = size;
            bottomTextDisplay.style.fontSize = size;
            fontSizeVal.innerText = size;
        });

        // 調整上方文字位置 (Top)
        topPosSlider.addEventListener('input', function() {
            const pos = this.value + 'px';
            topTextDisplay.style.top = pos;
            topPosVal.innerText = pos;
        });

        // 調整下方文字位置 (Bottom)
        bottomPosSlider.addEventListener('input', function() {
            const pos = this.value + 'px';
            bottomTextDisplay.style.bottom = pos;
            bottomPosVal.innerText = pos;
        });

        /* 4. 一鍵截圖並自動下載檔案 (html2canvas) */
        downloadBtn.addEventListener('click', function() {
            // 使用 html2canvas 將指定 DOM (memeContainer) 轉為 Canvas 畫布
            html2canvas(memeContainer, {
                useCORS: true, // 啟用跨域圖片轉繪
                scale: 2       // 提高解析度畫質
            }).then(function(canvas) {
                // 將 Canvas 轉為 Base64 格式圖片
                const imageUrl = canvas.toDataURL('image/png');
                
                // 創建一個隱藏的 <a> 標籤來觸發瀏覽器下載
                const downloadLink = document.createElement('a');
                downloadLink.href = imageUrl;
                downloadLink.download = 'my-meme.png'; // 依要求指定檔名為 my-meme.png
                
                // 觸發點擊並移除標籤
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            });
        });
    </script>
</body>
</html>
